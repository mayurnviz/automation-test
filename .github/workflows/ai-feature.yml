name: AI Feature

on:
  workflow_dispatch:
    inputs:
      task_name:
        description: 'ClickUp ticket title'
        required: true
        type: string
      task_description:
        description: 'Task for Aider to perform'
        required: true
        type: string
      branch_name:
        description: 'Branch name to create'
        required: true
        type: string

jobs:
  aider-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          pip install aider-install
          aider-install

      - name: Create branch
        run: git checkout -b "${{ inputs.branch_name }}"

      - name: Run Aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          aider --model gemini/gemini-3.6-flash --yes-always --message "${{ inputs.task_description }}"

      - name: Push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin "${{ inputs.branch_name }}"

      - name: Generate PR description
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git diff main..HEAD > diff.txt
          python3 -c "
          import json
          diff = open('diff.txt').read()
          payload = {'contents':[{'parts':[{'text': 'Write a concise PR description (1 sentence) summarizing this code change:\n\n' + diff}]}]}
          print(json.dumps(payload))
          " > payload.json
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json > response.json
          cat response.json
          python3 -c "
          import json
          data = json.load(open('response.json'))
          if 'candidates' in data:
              print(data['candidates'][0]['content']['parts'][0]['text'])
          else:
              print('Gemini API error - see logs above')
          " > pr_body.txt

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --title "AI: ${{ inputs.task_name }}" \
                        --body-file pr_body.txt \
                        --base main \
                        --head "${{ inputs.branch_name }}"